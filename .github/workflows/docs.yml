name: docs

# Builds the Sphinx docs (API reference and the tutorial notebook, executed
# during the build) on every push and pull request, and publishes them to
# GitHub Pages from main. Pages must be enabled with "GitHub Actions" as the
# source (Settings -> Pages).

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # PyVista renders the tutorial's figures off screen
      - uses: pyvista/setup-headless-display-action@v3

      - name: Build and install
        run: |
          # the gmsh wheel (liquid-bridge example) needs these
          sudo apt-get update && sudo apt-get install -y libglu1-mesa libxcursor1 libxft2 libxinerama1
          python -m pip install --upgrade pip
          python -m pip install -v ".[docs]"

      - name: Build the docs (warnings are errors)
        run: sphinx-build -W --keep-going docs docs/_build/html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  # The stress-cases page shows code with its outputs but isn't executed in
  # the build: run it and compare (numbers within 1e-3). Not a gate for
  # deploying the docs; a failure means the page needs `--update`.
  snippets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -v . scipy

      - name: Check the outputs shown in docs/stress_cases.md
        run: OMP_NUM_THREADS=2 python tools/check_doc_snippets.py

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
