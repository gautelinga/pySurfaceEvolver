name: docs

# Builds the Sphinx docs (API reference and the tutorial notebook, executed
# during the build) on every push and pull request, and publishes them to
# GitHub Pages from main. Pages must be enabled with "GitHub Actions" as the
# source (Settings -> Pages).

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # PyVista renders the tutorial's figures off screen
      - uses: pyvista/setup-headless-display-action@v3

      - name: Build and install
        run: |
          # the gmsh wheel (liquid-bridge example) needs these
          sudo apt-get update && sudo apt-get install -y libglu1-mesa libxcursor1 libxft2 libxinerama1
          python -m pip install --upgrade pip
          python -m pip install -v ".[docs]"

      # the notebooks run side by side (-j: one per core, each on one thread)
      - name: Build the docs (warnings are errors)
        run: OMP_NUM_THREADS=1 sphinx-build -W --keep-going -j auto docs docs/_build/html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/_build/html

  # The Markdown pages with code show its outputs but aren't executed in the
  # build: run them and compare (numbers within 1e-3; at 1, 2 and 4 threads
  # they agree to the printed digits). Not a gate for deploying the docs; a
  # failure means the page needs `--update`. Three jobs, each running its
  # pages' blocks four at a time on one thread each.
  snippets:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pages:
          - docs/packing.md docs/drainage_topology.md docs/periodic.md
          - docs/stress_cases.md docs/bridge_rupture.md docs/several_surfaces.md
          - docs/disk_bridge.md docs/pendant_drop.md docs/fibres.md docs/floating_lens.md
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build and install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -v . scipy

      - name: Check the outputs shown in ${{ matrix.pages }}
        run: OMP_NUM_THREADS=1 python tools/check_doc_snippets.py --jobs 4 ${{ matrix.pages }}

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
