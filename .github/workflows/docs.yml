name: docs

# Builds the Sphinx docs (API reference and the tutorial notebook, executed
# during the build) and uploads the HTML as an artifact; not published yet.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # PyVista renders the tutorial's figures off screen
      - uses: pyvista/setup-headless-display-action@v3

      - name: Build and install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -v ".[docs]"

      - name: Build the docs (warnings are errors)
        run: sphinx-build -W --keep-going docs docs/_build/html

      - uses: actions/upload-artifact@v4
        with:
          name: docs-html
          path: docs/_build/html
