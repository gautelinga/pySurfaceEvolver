name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # Linux only for now: the headless build uses the LINUX configuration in
    # src/include.h, which needs <sys/sysinfo.h> (not available on macOS).
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # PyVista needs an X server to render; the tests that render skip
      # without one, but the rest of test_viz.py still runs.
      - uses: pyvista/setup-headless-display-action@v3

      - name: Build and install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -v ".[test]"
          # optional: lets test_export.py check native cells with Gmsh itself
          python -m pip install gmsh || echo "gmsh not available; that test will skip"

      - name: Run tests
        run: python -m pytest -v

      - name: Type-check the package against its stubs
        run: |
          python -m pip install mypy
          python -m mypy -p pysurfaceevolver
